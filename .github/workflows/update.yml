name: Update Hantavirus Data

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos
  workflow_dispatch:           # también ejecutable a mano desde GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/update_data.py

      - name: Commit & push if data changed
        run: |
          git config user.name  "HantaBot 🤖"
          git config user.email "actions@github.com"
          git diff --quiet data.json && echo "Sin cambios en data.json" || (
            git add data.json &&
            git commit -m "chore: auto-update $(date -u '+%Y-%m-%d %H:%M UTC')" &&
            git push
          )
