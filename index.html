<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HantaTracker — Brote MV Hondius en Tiempo Real</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff6b35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HantaTracker">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <meta property="og:title" content="HantaTracker — Brote de Hantavirus 2026">
  <meta property="og:description" content="Mapa interactivo, timeline animado y feed de noticias en tiempo real del brote del MV Hondius.">
  <meta property="og:type" content="website">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson@3.0.2/dist/topojson.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-0: #06091a;
      --bg-1: #0a0f24;
      --bg-2: #0f1632;
      --bg-3: #16204a;
      --border: #1d2950;
      --border-2: #2a3a6e;
      --text-0: #ffffff;
      --text-1: #dde6f5;
      --text-2: #8899bb;
      --text-3: #4a5a80;
      --orange: #ff6b35;
      --orange-light: #ff8c42;
      --red: #e63946;
      --green: #4ade80;
      --yellow: #facc15;
      --blue: #4cc9f0;
      --purple: #a78bfa;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg-0);
      color: var(--text-1);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      overflow: hidden;
      height: 100dvh;
    }

    /* ── HEADER ── */
    #header {
      background: linear-gradient(180deg, #0b1230 0%, #08102a 100%);
      border-bottom: 1px solid var(--border);
      padding: 10px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 1px 0 rgba(255, 107, 53, 0.15);
    }
    #header-left { display: flex; align-items: center; gap: 14px; }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--orange);
      text-transform: uppercase;
    }
    .logo span { color: var(--text-1); font-weight: 300; letter-spacing: 1px; }
    .logo svg { width: 22px; height: 22px; }

    .virus-badge {
      font-size: 11px;
      color: var(--orange-light);
      border: 1px solid rgba(255, 107, 53, 0.4);
      background: rgba(255, 107, 53, 0.08);
      border-radius: 4px;
      padding: 3px 9px;
      letter-spacing: 0.6px;
      font-weight: 600;
    }

    #header-right { display: flex; align-items: center; gap: 18px; }
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-2);
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .live-dot {
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .updated-time {
      font-size: 11px;
      color: var(--text-3);
      font-family: 'Consolas', monospace;
    }

    /* ── STATS BAR ── */
    #stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }
    .stat-card {
      background: var(--bg-1);
      padding: 14px 22px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
      overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 3px;
      background: var(--accent, var(--orange));
    }
    .stat-card[data-color="cases"]    { --accent: var(--orange); }
    .stat-card[data-color="deaths"]   { --accent: var(--red); }
    .stat-card[data-color="recovered"]{ --accent: var(--green); }
    .stat-card[data-color="countries"]{ --accent: var(--blue); }

    .stat-label {
      font-size: 10px;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent, var(--orange));
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -1px;
    }
    .stat-sub {
      font-size: 11px;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .trend-up   { color: var(--red); }
    .trend-flat { color: var(--text-2); }

    /* ── MAIN ── */
    #main {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1px;
      background: var(--border);
      overflow: hidden;
      min-height: 0;
    }

    /* ── MAP ── */
    #map-wrap {
      background: var(--bg-0);
      position: relative;
      overflow: hidden;
    }
    #map-svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #map-svg:active { cursor: grabbing; }

    .country {
      fill: #0e1530;
      stroke: #1a2548;
      stroke-width: 0.5;
      transition: fill 0.25s ease;
    }
    .country.affected {
      fill: var(--country-fill, var(--orange));
      cursor: pointer;
    }
    .country.affected:hover {
      fill: var(--orange-light);
      stroke: var(--orange-light);
      stroke-width: 1.2;
    }
    .country.selected {
      fill: var(--orange-light) !important;
      stroke: #ffaa66 !important;
      stroke-width: 1.5 !important;
    }

    .bubble-pulse {
      fill: var(--red);
      opacity: 0.45;
      animation: bubble-pulse 2.4s ease-out infinite;
      pointer-events: none;
    }
    @keyframes bubble-pulse {
      0%   { opacity: 0.5; transform: scale(0.6); }
      100% { opacity: 0;   transform: scale(2.2); }
    }
    .bubble-core {
      fill: var(--red);
      stroke: #fff;
      stroke-width: 1.5;
      cursor: pointer;
      filter: drop-shadow(0 0 6px rgba(230, 57, 70, 0.6));
    }
    .bubble-label {
      fill: #fff;
      font-size: 10px;
      font-weight: 800;
      text-anchor: middle;
      pointer-events: none;
      font-family: 'Consolas', monospace;
    }

    /* Ship marker */
    .ship-icon {
      fill: var(--yellow);
      stroke: #000;
      stroke-width: 0.6;
      cursor: pointer;
      filter: drop-shadow(0 0 5px rgba(250, 204, 21, 0.7));
    }
    .ship-trail {
      fill: none;
      stroke: var(--yellow);
      stroke-width: 1.2;
      stroke-dasharray: 4 3;
      opacity: 0.45;
    }
    .ship-label {
      fill: var(--yellow);
      font-size: 9px;
      font-weight: 700;
      text-anchor: middle;
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    /* Map legend */
    #map-legend {
      position: absolute;
      bottom: 14px;
      left: 14px;
      background: rgba(10, 15, 36, 0.85);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 10px;
      color: var(--text-2);
      backdrop-filter: blur(6px);
    }
    #map-legend .legend-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 5px;
    }
    #map-legend .legend-row:last-child { margin-bottom: 0; }
    .legend-dot {
      width: 11px; height: 11px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .legend-line {
      width: 18px; height: 0; border-top: 2px dashed var(--yellow);
    }

    /* Map tooltip */
    #map-tooltip {
      position: absolute;
      background: rgba(8, 12, 28, 0.97);
      border: 1px solid var(--border-2);
      border-radius: 6px;
      padding: 8px 11px;
      font-size: 12px;
      pointer-events: none;
      display: none;
      z-index: 50;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      max-width: 220px;
    }
    #map-tooltip .tt-name { font-weight: 700; color: var(--text-0); margin-bottom: 3px; }
    #map-tooltip .tt-stat { color: var(--text-2); font-size: 11px; }
    #map-tooltip .tt-stat b { color: var(--orange); }

    /* Map controls */
    .map-controls {
      position: absolute;
      top: 14px; right: 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 10;
    }
    .map-btn {
      width: 32px; height: 32px;
      background: rgba(10, 15, 36, 0.9);
      border: 1px solid var(--border);
      color: var(--text-1);
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      transition: all 0.15s;
    }
    .map-btn:hover { border-color: var(--orange); color: var(--orange); }

    /* ── COUNTRY DETAIL PANEL ── */
    #country-panel {
      position: absolute;
      top: 14px; left: 14px;
      width: 320px;
      max-height: calc(100% - 28px);
      background: rgba(10, 15, 36, 0.95);
      border: 1px solid var(--border-2);
      border-radius: 8px;
      padding: 18px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: none;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      z-index: 20;
    }
    #country-panel.open { display: flex; animation: slide-in 0.25s ease-out; }
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .cp-head {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    }
    .cp-flag {
      width: 36px; height: 26px; border-radius: 3px;
      object-fit: cover; flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    .cp-title h3 { font-size: 16px; color: var(--text-0); font-weight: 700; }
    .cp-title .cp-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .cp-close {
      background: none; border: none; color: var(--text-2);
      font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px;
    }
    .cp-close:hover { color: var(--text-0); }

    .cp-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cp-stat-block {
      background: var(--bg-2);
      border-radius: 5px;
      padding: 10px 12px;
      border-left: 3px solid var(--accent);
    }
    .cp-stat-block.cases  { --accent: var(--orange); }
    .cp-stat-block.deaths { --accent: var(--red); }
    .cp-stat-block .lbl { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 1px; }
    .cp-stat-block .val { font-size: 22px; font-weight: 800; color: var(--accent); margin-top: 2px; line-height: 1; }

    .cp-status {
      font-size: 12px;
      padding: 7px 10px;
      background: rgba(230, 57, 70, 0.1);
      border: 1px solid rgba(230, 57, 70, 0.25);
      border-radius: 5px;
      color: #ffb3ba;
    }
    .cp-section-title {
      font-size: 10px;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-top: 4px;
    }
    .cp-notes {
      font-size: 12px;
      color: var(--text-2);
      line-height: 1.55;
      max-height: 120px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .cp-notes::-webkit-scrollbar { width: 4px; }
    .cp-notes::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .cp-spark {
      width: 100%; height: 60px;
    }
    .cp-spark-line { fill: none; stroke: var(--orange); stroke-width: 2; }
    .cp-spark-area { fill: var(--orange); opacity: 0.18; }
    .cp-spark-dot  { fill: var(--orange); }

    .cp-meta {
      display: flex; justify-content: space-between; font-size: 10px; color: var(--text-3);
      border-top: 1px solid var(--border); padding-top: 8px;
    }

    /* ── NEWS PANEL ── */
    #news-panel {
      background: var(--bg-1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .news-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .news-header h2 {
      font-size: 11px;
      color: var(--text-2);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 700;
    }
    .news-count {
      font-size: 10px;
      color: var(--orange);
      background: rgba(255, 107, 53, 0.12);
      padding: 3px 7px;
      border-radius: 10px;
      font-weight: 700;
    }
    #news-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    #news-list::-webkit-scrollbar { width: 4px; }
    #news-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .news-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .news-item:hover { background: var(--bg-2); }
    .news-item .src-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }
    .news-source-tag {
      font-size: 9px;
      color: var(--blue);
      background: rgba(76, 201, 240, 0.1);
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 700;
      letter-spacing: 0.5px;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .news-date { font-size: 10px; color: var(--text-3); white-space: nowrap; }
    .news-title {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-1);
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .news-title a { color: inherit; text-decoration: none; display: block; }
    .news-title a:hover { color: var(--orange-light); }
    .news-desc {
      font-size: 11px;
      color: var(--text-2);
      line-height: 1.5;
      max-height: 50px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    /* ── TIMELINE ── */
    #timeline {
      background: var(--bg-1);
      border-top: 1px solid var(--border);
      padding: 14px 22px 16px;
    }
    .timeline-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 14px;
    }
    .tl-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tl-btn {
      background: var(--bg-3);
      border: 1px solid var(--border-2);
      color: var(--text-1);
      width: 34px; height: 34px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .tl-btn:hover { background: var(--orange); border-color: var(--orange); color: var(--text-0); }
    .tl-btn.play {
      background: var(--orange);
      border-color: var(--orange);
      color: var(--text-0);
      width: auto;
      padding: 0 14px;
      gap: 6px;
      letter-spacing: 1px;
      font-size: 12px;
    }
    .tl-btn.play:hover { background: var(--orange-light); }

    .tl-current {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .tl-current .date {
      font-size: 18px;
      font-weight: 800;
      color: var(--orange);
      letter-spacing: 1px;
      font-family: 'Consolas', monospace;
      line-height: 1;
    }
    .tl-current .event {
      font-size: 11px;
      color: var(--text-2);
      max-width: 480px;
      text-align: right;
      margin-top: 3px;
      line-height: 1.3;
    }

    .tl-track-wrap {
      position: relative;
      padding: 18px 0 8px;
    }
    .tl-track {
      position: relative;
      height: 6px;
      background: var(--bg-3);
      border-radius: 3px;
      cursor: pointer;
    }
    .tl-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--yellow) 0%, var(--orange) 60%, var(--red) 100%);
      border-radius: 3px;
      pointer-events: none;
    }
    .tl-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      background: var(--text-0);
      border: 3px solid var(--orange);
      border-radius: 50%;
      cursor: grab;
      box-shadow: 0 0 12px rgba(255, 107, 53, 0.7);
      z-index: 5;
    }
    .tl-thumb:active { cursor: grabbing; }

    .tl-event-marker {
      position: absolute;
      top: -22px;
      transform: translateX(-50%);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      transition: transform 0.15s;
    }
    .tl-event-marker:hover { transform: translateX(-50%) scale(1.3); }
    .tl-event-marker.active { transform: translateX(-50%) scale(1.4); }
    .tl-event-marker::after {
      content: '';
      position: absolute;
      bottom: -8px;
      width: 2px; height: 8px;
      background: var(--text-3);
    }
    .tl-event-marker.passed::after { background: var(--orange); }

    .tl-axis {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 10px;
      color: var(--text-3);
      font-family: 'Consolas', monospace;
      letter-spacing: 0.5px;
    }

    /* ── COUNTERS ── */
    @keyframes flash-update {
      0%   { background: rgba(74, 222, 128, 0.15); }
      100% { background: transparent; }
    }
    .stat-card.flash { animation: flash-update 1.5s ease-out; }

    /* ── TABLET (≤960px) ── */
    @media (max-width: 960px) {
      #header { padding: 9px 14px; }
      .logo { font-size: 16px; letter-spacing: 1.5px; }
      .virus-badge { font-size: 10px; padding: 2px 7px; }
      .updated-time { display: none; }

      #stats { grid-template-columns: repeat(4, 1fr); }
      .stat-card { padding: 10px 12px; }
      .stat-value { font-size: 22px; }
      .stat-label { font-size: 9px; letter-spacing: 1px; }
      .stat-sub { font-size: 10px; }

      #main { grid-template-columns: 1fr 260px; }

      #timeline { padding: 10px 14px 12px; }
      .tl-current .event { font-size: 10px; max-width: 280px; }
    }

    /* ── MOBILE (≤720px) ── */
    @media (max-width: 720px) {
      body { grid-template-rows: auto auto 1fr auto auto; }

      #header {
        padding: 8px 12px;
        flex-wrap: wrap;
        gap: 8px;
      }
      #header-left { gap: 8px; }
      .logo { font-size: 14px; letter-spacing: 1px; }
      .logo svg { width: 18px; height: 18px; }
      .logo span { display: none; }
      .virus-badge {
        font-size: 9px;
        padding: 2px 6px;
        letter-spacing: 0.4px;
      }
      .live-badge { font-size: 10px; }
      .live-dot { width: 7px; height: 7px; }

      #stats {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: 1fr 1fr;
      }
      .stat-card {
        padding: 8px 12px;
        gap: 2px;
      }
      .stat-card::before { width: 2px; }
      .stat-label { font-size: 9px; letter-spacing: 0.8px; }
      .stat-value { font-size: 20px; letter-spacing: -0.5px; }
      .stat-sub { font-size: 10px; }

      #main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
        min-height: 0;
      }
      #map-wrap { min-height: 280px; }

      .map-controls {
        top: 8px; right: 8px;
        flex-direction: row;
      }
      .map-btn { width: 36px; height: 36px; font-size: 18px; }

      #map-legend {
        bottom: 8px; left: 8px;
        font-size: 9px;
        padding: 6px 9px;
      }
      #map-legend .legend-row { gap: 6px; margin-bottom: 3px; }

      /* News becomes a bottom sheet */
      #news-panel {
        max-height: 40vh;
        border-top: 2px solid var(--orange);
        position: relative;
      }
      #news-panel.collapsed { max-height: 44px; overflow: hidden; }
      #news-panel.collapsed #news-list { display: none; }

      .news-header {
        padding: 10px 14px;
        cursor: pointer;
        position: sticky;
        top: 0;
        background: var(--bg-1);
        z-index: 5;
      }
      .news-header::after {
        content: '▼';
        color: var(--text-3);
        font-size: 10px;
        transition: transform 0.2s;
        margin-left: auto;
        padding-left: 8px;
      }
      #news-panel.collapsed .news-header::after { transform: rotate(180deg); }

      .news-item { padding: 10px 14px; }
      .news-title { font-size: 12px; }
      .news-desc { font-size: 10.5px; -webkit-line-clamp: 2; max-height: 32px; }

      /* Country panel slides up from bottom */
      #country-panel {
        position: fixed;
        top: auto;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 100%;
        max-height: 75vh;
        border-radius: 14px 14px 0 0;
        border: 1px solid var(--border-2);
        border-bottom: none;
        padding: 18px 16px 24px;
        z-index: 200;
      }
      #country-panel.open { animation: slide-up 0.28s ease-out; }
      @keyframes slide-up {
        from { transform: translateY(100%); }
        to   { transform: translateY(0); }
      }
      #country-panel::before {
        content: '';
        position: absolute;
        top: 7px;
        left: 50%;
        transform: translateX(-50%);
        width: 38px;
        height: 4px;
        background: var(--border-2);
        border-radius: 2px;
      }
      .cp-head { margin-top: 10px; }
      .cp-close {
        font-size: 26px;
        padding: 4px 10px;
        background: var(--bg-2);
        border-radius: 6px;
      }
      .cp-notes { max-height: 100px; }

      /* Timeline */
      #timeline { padding: 8px 12px 10px; }
      .timeline-head { gap: 8px; margin-bottom: 10px; }
      .tl-controls { gap: 4px; }
      .tl-btn {
        width: 36px; height: 36px;
        font-size: 13px;
      }
      .tl-btn.play {
        padding: 0 12px;
        font-size: 11px;
      }
      .tl-current { align-items: flex-end; }
      .tl-current .date { font-size: 14px; }
      .tl-current .event {
        font-size: 9.5px;
        max-width: 180px;
        line-height: 1.25;
      }
      .tl-track-wrap { padding: 22px 0 6px; }
      .tl-event-marker {
        width: 22px; height: 22px;
        font-size: 11px;
        top: -22px;
      }
      .tl-event-marker::after { bottom: -6px; height: 6px; }
      .tl-axis { font-size: 9px; margin-top: 8px; }

      .tl-thumb {
        width: 22px;
        height: 22px;
      }
    }

    /* ── SMALL MOBILE (≤400px) ── */
    @media (max-width: 400px) {
      .virus-badge { display: none; }
      .stat-value { font-size: 18px; }
      .stat-label { font-size: 8.5px; }
      .stat-sub { font-size: 9.5px; }
      #map-wrap { min-height: 240px; }
      .tl-current .event { display: none; }
      .tl-current .date { font-size: 13px; }
    }

    /* ── LANDSCAPE PHONE ── */
    @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
      #stats { grid-template-columns: repeat(4, 1fr); }
      .stat-card { padding: 6px 10px; }
      .stat-value { font-size: 16px; }
      #news-panel { max-height: 100%; }
      #main { grid-template-columns: 1fr 220px; grid-template-rows: 1fr; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header id="header">
    <div id="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="3"/>
          <path d="M3 12h3M18 12h3M12 3v3M12 18v3"/>
        </svg>
        HantaTracker<span>· 2026</span>
      </div>
      <div class="virus-badge">CEPA ANDES · MV HONDIUS</div>
    </div>
    <div id="header-right">
      <div class="live-badge"><span class="live-dot"></span> LIVE</div>
      <div class="updated-time" id="updated-time">—</div>
    </div>
  </header>

  <!-- STATS BAR -->
  <section id="stats">
    <div class="stat-card" data-color="cases" id="card-cases">
      <div class="stat-label">Casos confirmados</div>
      <div class="stat-value" id="stat-cases">0</div>
      <div class="stat-sub"><span class="trend-up" id="trend-cases">↗ +0</span> en 7 días</div>
    </div>
    <div class="stat-card" data-color="deaths" id="card-deaths">
      <div class="stat-label">Fallecidos</div>
      <div class="stat-value" id="stat-deaths">0</div>
      <div class="stat-sub" id="cfr-sub">CFR 0%</div>
    </div>
    <div class="stat-card" data-color="recovered" id="card-recovered">
      <div class="stat-label">Recuperados</div>
      <div class="stat-value" id="stat-recovered">0</div>
      <div class="stat-sub">altas hospitalarias</div>
    </div>
    <div class="stat-card" data-color="countries" id="card-countries">
      <div class="stat-label">Países afectados</div>
      <div class="stat-value" id="stat-countries">0</div>
      <div class="stat-sub" id="trend-countries">3 continentes</div>
    </div>
  </section>

  <!-- MAIN -->
  <main id="main">

    <!-- MAP -->
    <div id="map-wrap">
      <svg id="map-svg"></svg>

      <div class="map-controls">
        <button class="map-btn" id="zoom-in" title="Zoom in">+</button>
        <button class="map-btn" id="zoom-out" title="Zoom out">−</button>
        <button class="map-btn" id="zoom-reset" title="Reset">⌂</button>
      </div>

      <div id="map-tooltip"></div>

      <div id="map-legend">
        <div class="legend-row"><span class="legend-dot" style="background:#ff6b35"></span> 1–2 casos</div>
        <div class="legend-row"><span class="legend-dot" style="background:#e63946"></span> 3+ casos</div>
        <div class="legend-row"><span class="legend-line"></span> ruta MV Hondius</div>
      </div>

      <!-- COUNTRY DETAIL PANEL -->
      <div id="country-panel">
        <div class="cp-head">
          <div style="display:flex;gap:10px;align-items:flex-start">
            <img class="cp-flag" id="cp-flag" alt="">
            <div class="cp-title">
              <h3 id="cp-name">—</h3>
              <div class="cp-sub" id="cp-firstcase">—</div>
            </div>
          </div>
          <button class="cp-close" id="cp-close">×</button>
        </div>
        <div class="cp-stats">
          <div class="cp-stat-block cases">
            <div class="lbl">Casos</div>
            <div class="val" id="cp-cases">0</div>
          </div>
          <div class="cp-stat-block deaths">
            <div class="lbl">Muertes</div>
            <div class="val" id="cp-deaths">0</div>
          </div>
        </div>
        <div class="cp-status" id="cp-status">—</div>
        <div class="cp-section-title">Evolución</div>
        <svg class="cp-spark" id="cp-spark" viewBox="0 0 280 60" preserveAspectRatio="none"></svg>
        <div class="cp-section-title">Notas</div>
        <div class="cp-notes" id="cp-notes">—</div>
      </div>
    </div>

    <!-- NEWS PANEL -->
    <aside id="news-panel">
      <div class="news-header">
        <h2>Últimas noticias</h2>
        <span class="news-count" id="news-count">0</span>
      </div>
      <div id="news-list"></div>
    </aside>

  </main>

  <!-- TIMELINE -->
  <section id="timeline">
    <div class="timeline-head">
      <div class="tl-controls">
        <button class="tl-btn" id="tl-prev" title="Anterior">◀</button>
        <button class="tl-btn play" id="tl-play"><span id="play-icon">▶</span> <span id="play-label">PLAY</span></button>
        <button class="tl-btn" id="tl-next" title="Siguiente">▶</button>
      </div>
      <div class="tl-current">
        <div class="date" id="tl-date">2026-04-01</div>
        <div class="event" id="tl-event">Día 0</div>
      </div>
    </div>
    <div class="tl-track-wrap">
      <div class="tl-track" id="tl-track">
        <div class="tl-fill" id="tl-fill"></div>
        <div class="tl-thumb" id="tl-thumb"></div>
      </div>
      <div class="tl-axis" id="tl-axis"></div>
    </div>
  </section>

  <script>
    // ───────────────────────────────────────────
    //  CONFIG & STATE
    // ───────────────────────────────────────────
    const COUNTRY_META = {
      AR: { name: 'Argentina',     centroid: [-63.6167, -38.4161] },
      NL: { name: 'Países Bajos',   centroid: [5.2913,    52.1326] },
      DE: { name: 'Alemania',       centroid: [10.4515,   51.1657] },
      ZA: { name: 'Sudáfrica',      centroid: [22.9375,   -30.5595] },
      ES: { name: 'España',         centroid: [-3.7492,    40.4637] },
    };
    const ISO_NUM_TO_CODE = {
      '032':'AR','528':'NL','276':'DE','710':'ZA','724':'ES',
    };

    // MV Hondius journey: Argentina → Atlantic → Cabo Verde → Canarias
    const SHIP_ROUTE = [
      [-63.6167, -38.4161],    // Argentina (origin)
      [-50, -25],
      [-30, -5],
      [-23.6, 15.1],            // Cabo Verde
      [-15.5, 28.1],            // Canarias (current)
    ];
    const SHIP_POSITION = [-15.5, 28.1];

    let DATA = null;
    let WORLD_GEO = null;
    let timelineIdx = 0;
    let isPlaying = false;
    let playInterval = null;

    // ───────────────────────────────────────────
    //  UTILITIES
    // ───────────────────────────────────────────
    function decodeHTMLEntities(str) {
      const txt = document.createElement('textarea');
      txt.innerHTML = str || '';
      return txt.value;
    }

    function animateNumber(el, from, to, duration = 600) {
      if (from === to) { el.textContent = to; return; }
      const start = performance.now();
      const isPercent = el.dataset?.fmt === 'percent';
      function frame(now) {
        const t = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - t, 3);
        const v = from + (to - from) * eased;
        el.textContent = isPercent ? v.toFixed(1) + '%' : Math.round(v).toLocaleString('es-ES');
        if (t < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function fmtDate(iso) {
      const d = new Date(iso + 'T12:00:00Z');
      return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
    }

    function eventIcon(eventText) {
      const t = (eventText || '').toLowerCase();
      if (t.includes('día 0') || t.includes('exposición')) return '⚠️';
      if (t.includes('crucero') || t.includes('mv hondius') || t.includes('barco')) return '🚢';
      if (t.includes('muerte') || t.includes('fallec')) return '💀';
      if (t.includes('oms') || t.includes('who')) return '🏥';
      if (t.includes('alerta') || t.includes('protocolo')) return '🚨';
      if (t.includes('europa') || t.includes('canarias') || t.includes('canarias')) return '🌍';
      return '📍';
    }

    // ───────────────────────────────────────────
    //  DATA LOAD
    // ───────────────────────────────────────────
    async function loadData() {
      const r = await fetch('data.json?t=' + Date.now());
      DATA = await r.json();
    }

    async function loadWorld() {
      const r = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
      WORLD_GEO = await r.json();
    }

    // ───────────────────────────────────────────
    //  MAP
    // ───────────────────────────────────────────
    let projection, pathGen, svg, gMap, gBubbles, gShip, zoom;

    function buildMap() {
      const wrap = document.getElementById('map-wrap');
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;

      svg = d3.select('#map-svg')
        .attr('viewBox', `0 0 ${w} ${h}`)
        .attr('preserveAspectRatio', 'xMidYMid meet');

      projection = d3.geoNaturalEarth1()
        .scale(w / 6.2)
        .translate([w / 2, h / 1.7]);

      pathGen = d3.geoPath().projection(projection);

      svg.selectAll('*').remove();

      const gRoot = svg.append('g').attr('class', 'root');
      gMap     = gRoot.append('g').attr('class', 'map');
      gShip    = gRoot.append('g').attr('class', 'ship');
      gBubbles = gRoot.append('g').attr('class', 'bubbles');

      const countries = topojson.feature(WORLD_GEO, WORLD_GEO.objects.countries).features;

      gMap.selectAll('path.country')
        .data(countries)
        .join('path')
        .attr('class', 'country')
        .attr('d', pathGen)
        .attr('data-id', d => String(d.id).padStart(3, '0'))
        .on('mouseenter', function(ev, d) {
          const code = ISO_NUM_TO_CODE[String(d.id).padStart(3, '0')];
          const c = currentSnapshotData()[code];
          if (c) showTooltip(ev, code, c);
        })
        .on('mousemove', moveTooltip)
        .on('mouseleave', hideTooltip)
        .on('click', function(ev, d) {
          const code = ISO_NUM_TO_CODE[String(d.id).padStart(3, '0')];
          if (code) openCountryPanel(code);
        });

      // Ship trail
      const lineGen = d3.line()
        .x(d => projection(d)[0])
        .y(d => projection(d)[1])
        .curve(d3.curveCatmullRom);
      gShip.append('path')
        .attr('class', 'ship-trail')
        .attr('d', lineGen(SHIP_ROUTE));

      // Ship icon
      const [sx, sy] = projection(SHIP_POSITION);
      const shipG = gShip.append('g').attr('transform', `translate(${sx}, ${sy})`);
      shipG.append('path')
        .attr('class', 'ship-icon')
        .attr('d', 'M-8,2 L8,2 L6,6 L-6,6 Z M-2,-6 L2,-6 L2,2 L-2,2 Z')
        .on('mouseenter', (ev) => showShipTooltip(ev))
        .on('mousemove', moveTooltip)
        .on('mouseleave', hideTooltip);
      shipG.append('text')
        .attr('class', 'ship-label')
        .attr('y', -10)
        .text('MV Hondius');

      // Zoom
      zoom = d3.zoom()
        .scaleExtent([1, 8])
        .on('zoom', (ev) => gRoot.attr('transform', ev.transform));
      svg.call(zoom);

      d3.select('#zoom-in').on('click',    () => svg.transition().call(zoom.scaleBy, 1.5));
      d3.select('#zoom-out').on('click',   () => svg.transition().call(zoom.scaleBy, 0.66));
      d3.select('#zoom-reset').on('click', () => svg.transition().call(zoom.transform, d3.zoomIdentity));
    }

    function currentSnapshotData() {
      const tl = DATA.timeline[timelineIdx];
      return tl?.snapshot || {};
    }

    function paintMap() {
      const snap = currentSnapshotData();
      gMap.selectAll('path.country')
        .classed('affected', false)
        .style('fill', null);

      Object.entries(snap).forEach(([code, info]) => {
        const meta = DATA.countries.find(c => c.code === code);
        if (!meta) return;
        const isoNum = meta.iso_num;
        const cases = info.cases;
        let fill = '#ff6b35';
        if (cases >= 3) fill = '#e63946';
        if (cases >= 6) fill = '#b71c2b';
        gMap.selectAll(`path.country[data-id="${isoNum}"]`)
          .classed('affected', true)
          .style('fill', fill);
      });

      // bubbles
      gBubbles.selectAll('*').remove();
      Object.entries(snap).forEach(([code, info]) => {
        const meta = COUNTRY_META[code];
        if (!meta) return;
        const [cx, cy] = projection(meta.centroid);
        const r = Math.max(8, Math.sqrt(info.cases) * 8);

        const grp = gBubbles.append('g').attr('transform', `translate(${cx}, ${cy})`);
        grp.append('circle').attr('class', 'bubble-pulse').attr('r', r);
        grp.append('circle')
          .attr('class', 'bubble-core')
          .attr('r', r * 0.55)
          .on('mouseenter', (ev) => showTooltip(ev, code, info))
          .on('mousemove', moveTooltip)
          .on('mouseleave', hideTooltip)
          .on('click', () => openCountryPanel(code));
        grp.append('text')
          .attr('class', 'bubble-label')
          .attr('y', 3)
          .text(info.cases);
      });
    }

    // ───────────────────────────────────────────
    //  TOOLTIP
    // ───────────────────────────────────────────
    function showTooltip(ev, code, info) {
      const meta = DATA.countries.find(c => c.code === code);
      const tt = document.getElementById('map-tooltip');
      tt.innerHTML = `
        <div class="tt-name">${meta?.name || code}</div>
        <div class="tt-stat"><b>${info.cases}</b> casos · <b>${info.deaths}</b> muertes</div>
        <div class="tt-stat" style="margin-top:4px;font-size:10px;color:#6a7a9a">click para detalles</div>
      `;
      tt.style.display = 'block';
      moveTooltip(ev);
    }
    function showShipTooltip(ev) {
      const tt = document.getElementById('map-tooltip');
      tt.innerHTML = `
        <div class="tt-name">🚢 MV Hondius</div>
        <div class="tt-stat">Crucero de expedición · <b>fuente del brote</b></div>
        <div class="tt-stat" style="margin-top:4px;font-size:10px;color:#facc15">Ahora: frente a Canarias</div>
      `;
      tt.style.display = 'block';
      moveTooltip(ev);
    }
    function moveTooltip(ev) {
      const tt = document.getElementById('map-tooltip');
      const wrap = document.getElementById('map-wrap').getBoundingClientRect();
      const x = ev.clientX - wrap.left;
      const y = ev.clientY - wrap.top;
      const offset = 14;
      const tw = tt.offsetWidth;
      const th = tt.offsetHeight;
      let left = x + offset;
      let top  = y + offset;
      if (left + tw > wrap.width)  left = x - tw - offset;
      if (top  + th > wrap.height) top  = y - th - offset;
      tt.style.left = left + 'px';
      tt.style.top  = top  + 'px';
    }
    function hideTooltip() {
      document.getElementById('map-tooltip').style.display = 'none';
    }

    // ───────────────────────────────────────────
    //  COUNTRY DETAIL PANEL
    // ───────────────────────────────────────────
    function openCountryPanel(code) {
      const meta = DATA.countries.find(c => c.code === code);
      if (!meta) return;

      document.getElementById('cp-name').textContent = meta.name;
      document.getElementById('cp-firstcase').textContent = `Primer caso: ${fmtDate(meta.first_case)}`;
      document.getElementById('cp-cases').textContent = meta.cases;
      document.getElementById('cp-deaths').textContent = meta.deaths;
      document.getElementById('cp-status').textContent = meta.status;
      document.getElementById('cp-notes').textContent = meta.notes;
      document.getElementById('cp-flag').src = `https://flagcdn.com/w80/${code.toLowerCase()}.png`;
      document.getElementById('cp-flag').alt = meta.name;

      drawCountrySparkline(code);

      document.getElementById('country-panel').classList.add('open');

      // Highlight selected country
      gMap.selectAll('path.country').classed('selected', false);
      gMap.selectAll(`path.country[data-id="${meta.iso_num}"]`).classed('selected', true);
    }

    function drawCountrySparkline(code) {
      const series = DATA.timeline.map(t => ({
        date: t.date,
        cases: (t.snapshot && t.snapshot[code]) ? t.snapshot[code].cases : 0,
      }));
      const W = 280, H = 60, P = 6;
      const x = d3.scaleLinear().domain([0, series.length - 1]).range([P, W - P]);
      const maxC = Math.max(1, d3.max(series, d => d.cases));
      const y = d3.scaleLinear().domain([0, maxC]).range([H - P, P]);

      const line = d3.line()
        .x((_, i) => x(i))
        .y(d => y(d.cases))
        .curve(d3.curveMonotoneX);

      const area = d3.area()
        .x((_, i) => x(i))
        .y0(H - P)
        .y1(d => y(d.cases))
        .curve(d3.curveMonotoneX);

      const svg = d3.select('#cp-spark');
      svg.selectAll('*').remove();
      svg.append('path').attr('class', 'cp-spark-area').attr('d', area(series));
      svg.append('path').attr('class', 'cp-spark-line').attr('d', line(series));
      const last = series[series.length - 1];
      svg.append('circle').attr('class', 'cp-spark-dot')
         .attr('cx', x(series.length - 1))
         .attr('cy', y(last.cases))
         .attr('r', 3);
    }

    document.getElementById('cp-close').addEventListener('click', () => {
      document.getElementById('country-panel').classList.remove('open');
      gMap.selectAll('path.country').classed('selected', false);
    });

    // ───────────────────────────────────────────
    //  STATS
    // ───────────────────────────────────────────
    let prevStats = { cases: 0, deaths: 0, recovered: 0, countries: 0 };

    function updateStats(snapshotMode = false) {
      let cases, deaths, recovered, countries;
      if (snapshotMode) {
        const tl = DATA.timeline[timelineIdx];
        cases = tl.cases;
        deaths = tl.deaths;
        recovered = tl.recovered || 0;
        countries = Object.keys(tl.snapshot || {}).length;
      } else {
        cases = DATA.current.cases;
        deaths = DATA.current.deaths;
        recovered = DATA.current.recovered || 0;
        countries = DATA.current.countries;
      }
      const cfr = cases > 0 ? (deaths / cases * 100) : 0;

      animateNumber(document.getElementById('stat-cases'),    prevStats.cases,    cases);
      animateNumber(document.getElementById('stat-deaths'),   prevStats.deaths,   deaths);
      animateNumber(document.getElementById('stat-recovered'),prevStats.recovered,recovered);
      animateNumber(document.getElementById('stat-countries'),prevStats.countries,countries);
      document.getElementById('cfr-sub').textContent = `CFR ${cfr.toFixed(1)}%`;

      if (!snapshotMode) {
        const past = DATA.timeline.length > 7 ? DATA.timeline[DATA.timeline.length - 7] : DATA.timeline[0];
        document.getElementById('trend-cases').textContent  = `↗ +${cases  - past.cases}`;
      }

      prevStats = { cases, deaths, recovered, countries };
    }

    // ───────────────────────────────────────────
    //  NEWS
    // ───────────────────────────────────────────
    function renderNews() {
      const list = document.getElementById('news-list');
      list.innerHTML = '';
      const items = DATA.news || [];
      document.getElementById('news-count').textContent = items.length;
      items.forEach(n => {
        const cleanTitle = decodeHTMLEntities(n.title || '').replace(/\s*-\s*[^-]+$/, '').trim();
        const cleanDesc  = decodeHTMLEntities(n.desc  || '').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
        const cleanSrc   = (n.source || '').replace(/^"hantavirus"\s*-\s*/i, '');
        const item = document.createElement('div');
        item.className = 'news-item';
        item.innerHTML = `
          <div class="src-line">
            <span class="news-source-tag">${cleanSrc}</span>
            <span class="news-date">${(n.date || '').slice(0, 16)}</span>
          </div>
          <div class="news-title"><a href="${n.url}" target="_blank" rel="noopener">${cleanTitle}</a></div>
          <div class="news-desc">${cleanDesc}</div>
        `;
        list.appendChild(item);
      });
    }

    // ───────────────────────────────────────────
    //  TIMELINE
    // ───────────────────────────────────────────
    function buildTimeline() {
      const track = document.getElementById('tl-track');
      const axis = document.getElementById('tl-axis');
      track.querySelectorAll('.tl-event-marker').forEach(el => el.remove());

      const n = DATA.timeline.length;
      DATA.timeline.forEach((tl, i) => {
        const pct = (i / (n - 1)) * 100;
        const m = document.createElement('div');
        m.className = 'tl-event-marker';
        m.style.left = pct + '%';
        m.textContent = eventIcon(tl.event);
        m.title = `${tl.date} — ${tl.event}`;
        m.addEventListener('click', () => goTo(i));
        track.appendChild(m);
      });

      // Axis labels - show 4 evenly spaced
      axis.innerHTML = '';
      const ticks = [0, Math.floor(n / 3), Math.floor(2 * n / 3), n - 1];
      ticks.forEach(i => {
        const span = document.createElement('span');
        span.textContent = fmtDate(DATA.timeline[i].date);
        axis.appendChild(span);
      });
    }

    function goTo(idx) {
      timelineIdx = Math.max(0, Math.min(DATA.timeline.length - 1, idx));
      const tl = DATA.timeline[timelineIdx];
      const pct = (timelineIdx / (DATA.timeline.length - 1)) * 100;

      document.getElementById('tl-fill').style.width = pct + '%';
      document.getElementById('tl-thumb').style.left = pct + '%';
      document.getElementById('tl-date').textContent = tl.date;
      document.getElementById('tl-event').textContent = tl.event;

      // Update event markers
      document.querySelectorAll('.tl-event-marker').forEach((m, i) => {
        m.classList.toggle('passed', i < timelineIdx);
        m.classList.toggle('active', i === timelineIdx);
      });

      paintMap();
      updateStats(true);
    }

    function setupTimelineDrag() {
      const track = document.getElementById('tl-track');
      const thumb = document.getElementById('tl-thumb');

      function handleSeek(clientX) {
        const rect = track.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        const idx = Math.round(pct * (DATA.timeline.length - 1));
        goTo(idx);
      }

      let dragging = false;
      thumb.addEventListener('mousedown', () => dragging = true);
      track.addEventListener('mousedown', (ev) => { dragging = true; handleSeek(ev.clientX); });
      window.addEventListener('mousemove', (ev) => { if (dragging) handleSeek(ev.clientX); });
      window.addEventListener('mouseup', () => dragging = false);

      // Touch
      thumb.addEventListener('touchstart', (ev) => { dragging = true; ev.preventDefault(); }, { passive: false });
      track.addEventListener('touchstart', (ev) => { dragging = true; handleSeek(ev.touches[0].clientX); }, { passive: true });
      window.addEventListener('touchmove', (ev) => { if (dragging) handleSeek(ev.touches[0].clientX); }, { passive: true });
      window.addEventListener('touchend', () => dragging = false);
    }

    function play() {
      if (timelineIdx >= DATA.timeline.length - 1) timelineIdx = 0;
      isPlaying = true;
      document.getElementById('play-icon').textContent = '⏸';
      document.getElementById('play-label').textContent = 'PAUSA';
      playInterval = setInterval(() => {
        if (timelineIdx >= DATA.timeline.length - 1) {
          stopPlay();
          return;
        }
        goTo(timelineIdx + 1);
      }, 900);
    }
    function stopPlay() {
      isPlaying = false;
      clearInterval(playInterval);
      document.getElementById('play-icon').textContent = '▶';
      document.getElementById('play-label').textContent = 'PLAY';
    }

    document.getElementById('tl-play').addEventListener('click', () => isPlaying ? stopPlay() : play());
    document.getElementById('tl-prev').addEventListener('click', () => goTo(timelineIdx - 1));
    document.getElementById('tl-next').addEventListener('click', () => goTo(timelineIdx + 1));

    // ───────────────────────────────────────────
    //  AUTO REFRESH
    // ───────────────────────────────────────────
    let lastHash = '';
    function dataHash(d) {
      return JSON.stringify({c: d.current, n: d.news?.length, u: d.metadata?.updated});
    }

    async function refreshData() {
      try {
        await loadData();
        const hash = dataHash(DATA);
        if (hash !== lastHash) {
          lastHash = hash;
          buildTimeline();
          renderNews();
          if (timelineIdx === 0 || timelineIdx >= DATA.timeline.length) {
            timelineIdx = DATA.timeline.length - 1;
          }
          goTo(timelineIdx);
          document.getElementById('updated-time').textContent = `Actualizado ${DATA.metadata.updated}`;
          // Flash stat cards on update
          document.querySelectorAll('.stat-card').forEach(c => {
            c.classList.remove('flash');
            void c.offsetWidth;
            c.classList.add('flash');
          });
        }
      } catch (e) {
        console.error('refresh failed', e);
      }
    }

    // ───────────────────────────────────────────
    //  INIT
    // ───────────────────────────────────────────
    async function init() {
      await Promise.all([loadData(), loadWorld()]);
      buildMap();
      buildTimeline();
      renderNews();
      timelineIdx = DATA.timeline.length - 1;
      lastHash = dataHash(DATA);
      goTo(timelineIdx);
      setupTimelineDrag();
      document.getElementById('updated-time').textContent = `Actualizado ${DATA.metadata.updated}`;

      // Auto-refresh every 5 min
      setInterval(refreshData, 5 * 60 * 1000);

      // Resize handling
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => { buildMap(); paintMap(); }, 200);
      });

      // Mobile: collapsible news panel (tap header to toggle)
      const newsPanel = document.getElementById('news-panel');
      const newsHeader = newsPanel.querySelector('.news-header');
      function isMobile() { return window.matchMedia('(max-width: 720px)').matches; }
      // Start collapsed on mobile so the map gets the focus
      if (isMobile()) newsPanel.classList.add('collapsed');
      newsHeader.addEventListener('click', () => {
        if (isMobile()) newsPanel.classList.toggle('collapsed');
      });

      // Close country panel when tapping outside the panel on mobile
      document.addEventListener('click', (ev) => {
        if (!isMobile()) return;
        const panel = document.getElementById('country-panel');
        if (!panel.classList.contains('open')) return;
        if (panel.contains(ev.target)) return;
        // Don't close if clicking on map (map clicks open the panel)
        if (ev.target.closest('#map-wrap')) return;
        panel.classList.remove('open');
        gMap.selectAll('path.country').classed('selected', false);
      });
    }

    // Service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    init();
  </script>
</body>
</html>
